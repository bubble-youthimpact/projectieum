<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="ieum-mode" content="path">
<meta name="description" content="Project IEUM — simple, verified information and support services for foreign residents in Jeju: housing, healthcare, work and administration.">
<link rel="icon" type="image/svg+xml" href="assets/logo-illustration.svg">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<meta property="og:title" content="Project IEUM">
<meta property="og:description" content="Connecting people to a brighter Jeju.">
<meta property="og:image" content="assets/logo-mark.png">
<title>Project IEUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: airy sky-blue canvas with frosted-glass panels; situations read as a trail of numbered markers on a soft blue line. */
:root{
  --paper:#E3F1FC; --paper2:#F2F8FD; --surface:rgb(255 255 255 / .72); --solid:#FFFFFF; --sunk:#EDF5FC; --ink:#0D1B2A; --muted:#566779; --line:rgb(13 60 100 / .10);
  --sea:#0284C7; --sea-2:#38BDF8; --sea-soft:#E0F2FE; --tan:#EA6A1A; --tan-soft:#FFEEDF; --leaf:#0F8A63; --leaf-soft:#DDF5EC; --violet:#6D5BD0; --violet-soft:#ECE9FB;
  --alert:#D2402C; --alert-soft:#FDECE8; --focus:#0284C7;
  --f-display:"Plus Jakarta Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Noto Sans KR","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; --r-sm:14px;
  --shadow:0 1px 1px rgb(2 60 110 / .04), 0 12px 32px -14px rgb(2 60 110 / .22);
  --glow:radial-gradient(600px 420px at 8% -5%, rgb(56 189 248 / .35), transparent 70%), radial-gradient(700px 500px at 100% 30%, rgb(129 140 248 / .16), transparent 70%);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#071521; --paper2:#0A1C2B; --surface:rgb(17 37 54 / .72); --solid:#10273A; --sunk:#0E2232; --ink:#E6F1FA; --muted:#93A9BC; --line:rgb(180 220 255 / .10);
  --sea:#38BDF8; --sea-2:#7DD3FC; --sea-soft:#0C2E45; --tan:#F59A5B; --tan-soft:#3A2414; --leaf:#4ADE9F; --leaf-soft:#0F3427; --violet:#A79BF5; --violet-soft:#241F45;
  --alert:#F58C78; --alert-soft:#3A1915; --focus:#38BDF8; --shadow:0 12px 32px -14px rgb(0 0 0 / .6);
  --glow:radial-gradient(600px 420px at 8% -5%, rgb(56 189 248 / .18), transparent 70%), radial-gradient(700px 500px at 100% 30%, rgb(129 140 248 / .10), transparent 70%); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#071521; --paper2:#0A1C2B; --surface:rgb(17 37 54 / .72); --solid:#10273A; --sunk:#0E2232; --ink:#E6F1FA; --muted:#93A9BC; --line:rgb(180 220 255 / .10);
  --sea:#38BDF8; --sea-2:#7DD3FC; --sea-soft:#0C2E45; --tan:#F59A5B; --tan-soft:#3A2414; --leaf:#4ADE9F; --leaf-soft:#0F3427; --violet:#A79BF5; --violet-soft:#241F45;
  --alert:#F58C78; --alert-soft:#3A1915; --focus:#38BDF8; --shadow:0 12px 32px -14px rgb(0 0 0 / .6);
  --glow:radial-gradient(600px 420px at 8% -5%, rgb(56 189 248 / .18), transparent 70%), radial-gradient(700px 500px at 100% 30%, rgb(129 140 248 / .10), transparent 70%); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--glow),linear-gradient(180deg,var(--paper),var(--paper2) 60%);background-attachment:fixed;min-height:100vh;color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ko{font-family:var(--f-body);font-weight:600}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0D1B2A,#1E3A5F);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.mark span{font:700 13px var(--f-mono);color:var(--paper);letter-spacing:.04em}
.mark span{color:#fff}.mark::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,#38BDF8,#0284C7)}
.brand b{display:block;font:800 1.02rem/1.1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font-size:.74rem;color:var(--muted)}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px;color:var(--muted)}
.nav a:hover{color:var(--ink)}.nav a[aria-current]{color:var(--sea);background:var(--solid);box-shadow:var(--shadow)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface);backdrop-filter:blur(8px)}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:var(--shadow)}
.note{background:var(--sea-soft);color:var(--ink);font-size:.86rem}
.note .wrap{padding-block:8px}
@media (max-width:720px){ .nav{display:none} .brand small{display:none} }

/* emergency strip */
.sos{background:transparent;padding-top:28px}.sos .wrap{margin-top:0;border-radius:999px;background:var(--alert-soft);max-width:1040px}
.sos .wrap{display:flex;align-items:center;gap:12px;padding-block:9px;font-size:.9rem;flex-wrap:wrap}
.sos strong{color:var(--alert)}
.sos a{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;background:var(--alert);color:var(--surface);padding:5px 12px;border-radius:999px;font-size:.85rem}

/* breadcrumb */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-top:28px;font-size:.85rem;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{opacity:.5}
.crumbs [aria-current]{color:var(--ink);font-weight:500}

/* hero */
.hero{padding-block:22px 34px;max-width:760px}
.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--cat,var(--sea));margin-bottom:12px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
h1{font:800 clamp(2.1rem,5.4vw,3.5rem)/1.04 var(--f-display);letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.lede{font-size:1.12rem;color:var(--muted);margin:0;max-width:62ch}
.term{display:inline-flex;gap:8px;align-items:baseline;margin-top:16px;padding:6px 12px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);font-size:.9rem}
h2{font:800 1.45rem/1.2 var(--f-display);letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
h3{font:600 1.05rem/1.35 var(--f-body);margin:0}

/* category colours */
.c-housing{--cat:var(--sea);--cat-soft:var(--sea-soft);--badge:var(--tan);--badge-soft:var(--tan-soft)}
.c-health{--cat:var(--sea);--cat-soft:var(--sea-soft);--badge:var(--leaf);--badge-soft:var(--leaf-soft)}
.c-work{--cat:var(--sea);--cat-soft:var(--sea-soft);--badge:var(--violet);--badge-soft:var(--violet-soft)}

/* home */
.home-hero{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.home-hero h1{font-size:clamp(2.4rem,6.4vw,4.4rem)}
.trailart{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:32px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.trailart svg{width:100%;height:100%;display:block}
@media (max-width:820px){.home-hero{grid-template-columns:1fr}.trailart{display:none}}
.langpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px;font-size:.9rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.cats{grid-template-columns:1fr}}
.cat{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:26px;position:relative;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.cat:hover{transform:translateY(-4px);box-shadow:0 24px 48px -20px rgb(2 90 160 / .35)}
.cat .ico{width:48px;height:48px;border-radius:15px;background:var(--badge-soft);color:var(--badge);display:grid;place-items:center}
.cat h2{font-size:1.5rem;margin-top:6px}
.cat p{margin:0;color:var(--muted);font-size:.95rem}
.cat ul{list-style:none;margin:6px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.cat ul li::before{content:"→ ";color:var(--sea)}
.go{margin-top:auto;padding-top:8px;font-weight:700;color:var(--sea);display:inline-flex;gap:6px;align-items:center}
.soon{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:3px 8px;border-radius:999px;align-self:flex-start}

.section{padding-block:40px}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sechead p{margin:0;color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;border-top:1px solid var(--line);background:var(--surface);backdrop-filter:blur(14px);border-radius:var(--r);padding:6px 22px;box-shadow:var(--shadow);border:1px solid var(--line)}
@media (max-width:720px){.quick{grid-template-columns:1fr}}
.quick a{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.quick a:hover .q{text-decoration:underline}
.quick .dot{width:10px;height:10px;border-radius:50%;background:var(--badge);flex:none}
.quick .q{flex:1;min-width:0}
.quick .arr{color:var(--muted)}

.band{background:linear-gradient(120deg,#0369A1,#0284C7 45%,#38BDF8);color:#fff;border-radius:28px;padding:36px;box-shadow:0 24px 48px -24px rgb(2 132 199 / .6);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{color:#fff}
.band p{margin:0;opacity:.9;max-width:56ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;transition:transform .15s,box-shadow .15s;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:.95rem}
.btn-primary{background:var(--sea);color:#fff;box-shadow:0 8px 20px -8px rgb(2 132 199 / .7)}.btn-primary:hover{transform:translateY(-1px)}
.band .btn-primary{background:#fff;color:#0369A1;box-shadow:none}
.btn-ghost{background:var(--solid);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}

/* hub: situation list */
.situations{display:grid;gap:12px;counter-reset:s}
.sit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px 22px;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s}
.sit:hover{transform:translateX(4px)}
.sit .flag{width:40px;height:40px;border-radius:13px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center}
.sit h3{font-size:1.1rem;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.sit p{margin:3px 0 0;color:var(--muted);font-size:.93rem}
.sit .meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.sit.is-soon{opacity:.75}
@media (max-width:560px){.sit{grid-template-columns:auto minmax(0,1fr)}.sit .meta{grid-column:2;text-align:left}}
.foot-note{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}

/* guide */
.guide{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:start;padding-bottom:20px}
@media (max-width:900px){.guide{grid-template-columns:1fr}}
.block{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:30px;margin-bottom:18px;box-shadow:var(--shadow)}
@media (max-width:560px){.block{padding:20px}}
.block>header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.block>header .lbl{color:var(--sea);font-weight:600}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:0}
.trail>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px;position:relative;padding-bottom:26px}
.trail>li:last-child{padding-bottom:0}
.trail>li::before{content:"";position:absolute;left:16px;top:38px;bottom:4px;width:2px;background:linear-gradient(var(--sea-2),var(--sea-soft));border-radius:2px}
.trail>li:last-child::before{display:none}
.trail .n{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--sea-2),var(--sea));color:#fff;box-shadow:0 6px 14px -6px rgb(2 132 199 / .7);display:grid;place-items:center;font:600 .85rem var(--f-mono)}
.trail h3{padding-top:5px}
.trail p{margin:4px 0 0;color:var(--muted)}
.trail .extra{margin-top:14px}
.minicards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.mini{background:var(--solid);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px}
.mini b{display:block;font-weight:600}
.mini .ko{display:block;color:var(--leaf);font-size:.88rem;font-weight:600;margin-top:1px}
.mini p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
details.dept{background:var(--sunk);border-radius:var(--r-sm);padding:12px 16px}
details.dept summary{cursor:pointer;font-weight:600}
.deptlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;margin-top:12px;font-size:.92rem}
.deptlist div{display:flex;gap:8px;justify-content:space-between;border-bottom:1px dashed var(--line);padding-block:6px}
.deptlist span:first-child{color:var(--leaf);font-weight:600}

.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--sunk)}
.checks input{width:19px;height:19px;margin:3px 0 0;accent-color:var(--sea);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{font:500 .78rem var(--f-mono);color:var(--muted);margin-left:auto}
.small{font-size:.88rem;color:var(--muted);margin:12px 0 0}

.links{display:grid;gap:10px}
.lnk{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--line);border-radius:var(--r-sm);text-decoration:none;background:var(--solid);transition:transform .15s}
.lnk:hover{transform:translateX(3px);border-color:var(--sea)}
.lnk .t{flex:1;min-width:0;font-weight:600}
.lnk .t small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.lnk .badge{font:500 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--leaf);background:var(--leaf-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.lnk.primary{background:linear-gradient(120deg,#0284C7,#38BDF8);border-color:transparent;color:#fff;box-shadow:0 10px 24px -12px rgb(2 132 199 / .8)}
.lnk.primary small{color:#fff;opacity:.85}

.tips{display:grid;gap:10px}
.tip{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--sea-soft)}
.tip.warn{background:var(--tan-soft)}.tip{border-radius:var(--r-sm)}
.tip.warn svg{color:var(--tan)}
.tip svg{color:var(--sea);margin-top:3px}
.tip b{display:block}
.tip p{margin:2px 0 0;color:var(--muted);font-size:.94rem}

.aside{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.aside{position:static}}
.aside .box{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.aside .box + .box{margin-top:12px}
.aside h4{margin:0 0 10px;font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.aside ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.aside ol a{display:flex;gap:10px;padding:7px 8px;border-radius:7px;text-decoration:none;font-size:.9rem}
.aside ol a:hover{background:var(--sunk)}
.aside ol a[aria-current]{background:var(--cat-soft,var(--sea-soft));font-weight:600}
.aside ol a i{font:normal 500 .75rem var(--f-mono);color:var(--muted);padding-top:2px}
@media (max-width:900px){.aside .box.sibs{display:none}}

.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:8px 32px}
.nextprev a{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;text-decoration:none;background:var(--surface);backdrop-filter:blur(14px)}
.nextprev a:hover{border-color:var(--sea)}
.nextprev small{display:block;color:var(--muted);font-size:.78rem}
.nextprev b{font-weight:600}
.nextprev .nx{text-align:right;grid-column:2}
@media (max-width:560px){.nextprev{grid-template-columns:1fr}.nextprev .nx{grid-column:1}}

.feedback{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--line);margin-bottom:24px}
.feedback b{margin-right:auto;font-weight:600}
.feedback .msg{width:100%;color:var(--muted);font-size:.92rem;margin:0}

/* housing types */
.typetabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.typetabs a{text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.9rem}
.typetabs a[aria-current]{background:var(--sea);border-color:var(--sea);color:#fff}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:f;margin-bottom:6px}
@media (max-width:720px){.flow{grid-template-columns:1fr 1fr;gap:14px 0}}
.flow li{list-style:none;position:relative;padding:0 10px 0 0}
.flow li::before{content:"";position:absolute;top:16px;left:34px;right:0;height:2px;background:linear-gradient(90deg,var(--sea-2),var(--sea-soft))}
.flow li:last-child::before{display:none}
.flow .n{width:34px;height:34px;border-radius:12px;color:#fff;display:grid;place-items:center;font:600 .85rem var(--f-mono);background:linear-gradient(135deg,var(--sea-2),var(--sea));position:relative}
.flow b{display:block;margin-top:10px;font-weight:600;line-height:1.3}
.flow span{display:block;font-size:.85rem;color:var(--muted)}
.costs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cost{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;background:var(--solid)}
.cost .ko{font-size:1.02rem;color:var(--ink)}
.cost em{font-style:normal;color:var(--muted);font-size:.85rem;margin-left:6px}
.cost p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.know{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.know li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px}
.know svg{color:var(--sea);margin-top:3px}
.know p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.key{margin-top:20px;padding:18px 20px;border-radius:var(--r-sm);background:var(--tan-soft)}

let PRESET=null;
/* ---------- router: clean paths on the real site, # fallback in previews ---------- */
const PATHMODE=!!document.querySelector('meta[name="ieum-mode"][content="path"]');
const BASE=PATHMODE?new URL(document.baseURI).pathname:'';
try{ if(PATHMODE) localStorage.setItem('ieum-base',BASE); }catch(e){}
function href(r){ if(!PATHMODE) return '#'+r; return r==='home'?BASE:BASE+r.split('.').join('/')+'/'; }
function curRoute(){
  if(!PATHMODE) return (location.hash||'#home').slice(1)||'home';
  let p=decodeURIComponent(location.pathname);
  if(p.startsWith(BASE)) p=p.slice(BASE.length); else p=p.replace(/^\//,'');
  p=p.replace(/index\.html$/,'').replace(/^\/+|\/+$/g,'');
  return p?p.split('/').join('.'):'home';
}
function go(r,replace){ if(PATHMODE){ history[replace?'replaceState':'pushState'](null,'',href(r)); render(); scrollTo(0,0);} else { replace?location.replace('#'+r):(location.hash=r); } }
function fixLinks(root){ if(!PATHMODE) return; root.querySelectorAll('a[href^="#"]').forEach(a=>{const r=a.getAttribute('href').slice(1); if(P[r]||ALIAS[r]) a.setAttribute('href',href(r));}); }
if(PATHMODE && location.hash.length>1 && (P[location.hash.slice(1)]||ALIAS[location.hash.slice(1)])) history.replaceState(null,'',href(location.hash.slice(1)));
/* ---------- router ---------- */
const state={lang: store.get('lang')||'en'};
function render(){
  let r=curRoute();
  if(ALIAS[r]){PRESET=ALIAS[r]; go('support',true); return;}
  if(!P[r]) r=PATHMODE?'notfound':'home';
  const p=P[r];
  $('#app').innerHTML=`<div class="fade">${R[p.type](r,p)}</div>`;
  $('#sos').innerHTML = catOf(r)==='health' ? `<div class="sos"><div class="wrap"><strong>Need urgent medical help?</strong><span>If you think you need urgent medical help, call 119.</span><a href="tel:119">${I.phone} Call 119</a></div></div>` : p.urgent ? `<div class="sos"><div class="wrap"><strong>In immediate danger?</strong><span>Call police on 112, or 119 for emergency or medical help.</span><a href="tel:112">${I.phone} Call 112</a></div></div>`:'';
  document.querySelectorAll('.mi').forEach(m=>m.toggleAttribute('data-on', (r!=='home'&&(catOf(r)===m.dataset.k||r.split('.')[0]===m.dataset.k))));
  closeMenus();
  document.title = r==='home'?'Project IEUM':`${p.title} · Project IEUM`;
  if(p.type==='services') drawServices();
  fixLinks(document);
  syncLang();
}
function syncLang(){
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===state.lang)));
  const lab={ko:'한국어',en:'English',zh:'中文',vi:'Tiếng Việt'}[state.lang]; const lc=$('#langcur'); if(lc) lc.textContent={ko:'KO',en:'EN',zh:'中文',vi:'VI'}[state.lang]; if(lc) lc.parentElement.setAttribute('aria-label','Language: '+lab); document.querySelectorAll('.dlcur').forEach(x=>x.textContent=lab);
  const msg={ko:'한국어 번역을 준비하고 있습니다. 지금은 영어로 표시됩니다.',zh:'中文翻译正在准备中，目前以英文显示。',vi:'Bản tiếng Việt đang được chuẩn bị. Hiện đang hiển thị tiếng Anh.'}[state.lang];
  $('#langnote').hidden=!msg; if(msg) $('#langnotetext').textContent=msg;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#burger')){ $('#mnav').hidden?openDrawer():closeDrawer(); return;}
  if(e.target.closest('[data-closemenu]')){closeDrawer(); return;}
  if(e.target.closest('[data-dlang]')){const m=$('#dlangmenu'); m.hidden=!m.hidden; e.target.closest('[data-dlang]').setAttribute('aria-expanded',String(!m.hidden)); return;}
  const mb=e.target.closest('.mi>button'); if(mb){const mi=mb.parentElement; const open=!mi.hasAttribute('data-open'); closeMenus(); if(open){mi.setAttribute('data-open',''); mb.setAttribute('aria-expanded','true');} return;}
  if(!e.target.closest('.mi')) document.querySelectorAll('.mi[data-open]').forEach(m=>m.removeAttribute('data-open'));
  if(e.target.closest('#langbtn')){const m=$('#langmenu'); m.hidden=!m.hidden; $('#langbtn').setAttribute('aria-expanded',String(!m.hidden)); return;}
  const lb=e.target.closest('[data-lang]'); if(lb){state.lang=lb.dataset.lang; store.set('lang',state.lang); syncLang(); $('#langmenu').hidden=true; $('#langbtn').setAttribute('aria-expanded','false'); return;}
  if(!e.target.closest('#langdd')){$('#langmenu').hidden=true; $('#langbtn').setAttribute('aria-expanded','false');}
  const sh=e.target.closest('[data-show]'); if(sh){const ph=P[sh.dataset.r].steps[sh.dataset.s].phrases[sh.dataset.show];
    const d=document.createElement('div'); d.className='full'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Phrase for medical staff');
    d.innerHTML=`<button class="btn btn-ghost" data-close>Close</button><p class="kr">${ph[0].replace('\n','<br>')}</p><p class="en">${ph[1].replace('\n','<br>')}</p>`;
    document.body.appendChild(d); d.querySelector('button').focus(); return;}
  if(e.target.closest('[data-close]')){e.target.closest('.full').remove(); return;}
  const tb=e.target.closest('[data-topic]'); if(tb){document.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(b===tb))); fillNeeds('all'); drawServices(); return;}
  const cp=e.target.closest('[data-copy]'); if(cp){const t=MSGS[cp.dataset.r][cp.dataset.copy][0];
    const done=()=>{cp.textContent='Copied ✓'; setTimeout(()=>cp.textContent='Copy Korean text',1800)};
    try{navigator.clipboard.writeText(t).then(done,()=>selectEl($('#msg-'+cp.dataset.copy)))}catch(_){selectEl($('#msg-'+cp.dataset.copy))} return;}
  if(e.target.closest('[data-logadd]')){const rows=readLog(); rows.push({d:'',w:'',e:'',t:''}); store.set('log:landlord',rows); render(); return;}
  if(e.target.closest('[data-logcopy]')){const txt=readLog().filter(x=>x.d||x.w).map(x=>`${x.d||'(no date)'} — ${x.w}${x.e?` | Evidence: ${x.e}`:''}${x.t?` | Told: ${x.t}`:''}`).join('\n');
    const m=$('#logmsg'); try{navigator.clipboard.writeText(txt).then(()=>m.textContent='Copied. Paste it into a message or document.',()=>m.textContent=txt)}catch(_){m.textContent=txt} return;}
  const fb=e.target.closest('[data-fb]'); if(fb){const box=fb.closest('.feedback');
    box.innerHTML = fb.dataset.fb==='yes' ? `<b>Thanks — glad it helped.</b>` : `<b>Thanks for telling us.</b><p class="msg">We’ll use this to improve the guide. If you still need help now, <a href="#support">talk to a support organisation</a>.</p>`;}
});
document.addEventListener('change',e=>{
  if(e.target.matches('.checks input')){const r=curRoute();
    const done=[...document.querySelectorAll('.checks input')].filter(x=>x.checked).map(x=>+x.dataset.i);
    store.set('chk:'+r,done); const pr=$('#prog'); if(pr) pr.textContent=`${done.length}/${document.querySelectorAll('.checks input').length} ready`;}
  if(e.target.matches('#f-lang,#f-need,#f-loc')) drawServices();
});
function selectEl(el){const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}
function readLog(){return [...document.querySelectorAll('table.log tbody tr')].map((tr,i)=>({d:$('#log-d-'+i).value,w:$('#log-w-'+i).value,e:$('#log-e-'+i).value,t:$('#log-t-'+i).value}));}
document.addEventListener('input',e=>{if(e.target.closest('table.log')) store.set('log:landlord',readLog());});
addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelector(".full")?.remove();closeMenus();}});
addEventListener("hashchange",()=>{ if(PATHMODE){ const h=location.hash.slice(1); if(P[h]||ALIAS[h]) go(h,true); return; } render(); scrollTo(0,0); $('#app').focus({preventScroll:true});});
addEventListener("popstate",()=>{ if(PATHMODE){ render(); $('#app').focus({preventScroll:true}); } });
document.addEventListener('click',e=>{
  if(!PATHMODE||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  const a=e.target.closest('a[href]'); if(!a||a.target||a.hasAttribute('download')) return;
  const raw=a.getAttribute('href'); if(raw.startsWith('#')){ const h=raw.slice(1); if(P[h]||ALIAS[h]){ e.preventDefault(); go(h); } return; }
  const u=new URL(a.href,location.href); if(u.origin!==location.origin||!u.pathname.startsWith(BASE)) return;
  e.preventDefault(); if(u.pathname===location.pathname){ scrollTo(0,0); closeMenus(); return; }
  history.pushState(null,'',u.pathname); render(); scrollTo(0,0); $('#app').focus({preventScroll:true});
});
buildChrome();
fixLinks(document);
render();
</script>
</body>
</html>
